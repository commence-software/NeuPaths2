<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NeuPaths — Topology Viewer</title>
<style>
  :root{
    --paper:#EDF1F6; --surface:#FFF; --surface-2:#F6F8FB;
    --ink:#0F1620; --ink-2:#3D4B5C; --ink-3:#6B7A8D;
    --line:#D5DDE7; --line-2:#B9C4D2;
    --signal:#1257E6; --signal-soft:#E4ECFD;
    --warn:#B4541A; --warn-soft:#FDF0E6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;
       background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
         padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  h1 span{color:var(--ink-3);font-weight:400}
  .tabs{display:flex;gap:4px}
  /* an author display rule outranks the UA stylesheet's [hidden] */
  [hidden]{display:none !important}
  button{font:inherit;padding:5px 12px;border:1px solid var(--line-2);background:var(--surface);
         color:var(--ink-2);border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--signal);color:var(--signal)}
  button.on{background:var(--signal);border-color:var(--signal);color:#fff}
  label.chk{display:flex;align-items:center;gap:5px;color:var(--ink-2);cursor:pointer;user-select:none}
  .spacer{flex:1}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;overflow:hidden;background:var(--surface)}
  #stage svg{width:100%;height:100%;display:block;cursor:grab}
  #stage svg.drag{cursor:grabbing}
  aside{width:320px;border-left:1px solid var(--line);background:var(--surface-2);
        overflow-y:auto;padding:14px 16px}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--signal);
           margin:18px 0 8px;font-weight:650}
  aside h2:first-child{margin-top:0}
  .f{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);
     border-radius:5px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;line-height:1.45}
  .f.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  .f.info{border-left-color:var(--signal)}
  .f b{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
  .f .why{color:var(--ink-3);display:block;margin-top:3px}
  .f{position:relative;padding-right:24px}
  .f .x{position:absolute;top:5px;right:6px;width:16px;height:16px;line-height:14px;
        text-align:center;border-radius:4px;color:var(--ink-3);cursor:pointer;
        font-size:14px;opacity:0;transition:opacity .12s}
  .f:hover .x{opacity:1}
  .f .x:hover{background:var(--line);color:var(--ink)}
  .muted{color:var(--ink-3);font-size:12px;cursor:pointer;margin:6px 0 2px;display:inline-block}
  .muted:hover{color:var(--signal)}
  .f.was-dismissed{opacity:.55;border-left-color:var(--line-2);background:var(--surface-2)}
  .hint{color:var(--ink-3);font-size:12px;line-height:1.5}
  .legend{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink-3)}
  .legend i{display:inline-block;width:26px;height:0;border-top:2px solid var(--ink-3);
            margin-right:4px;vertical-align:middle}
  .legend i.dash{border-top-style:dashed}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid;
              margin-right:4px;vertical-align:-1px}
  svg text{font-family:var(--sans);fill:var(--ink)}
  .nlabel{font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .elabel{font-size:10px;fill:var(--ink-3);text-anchor:middle;paint-order:stroke;
          stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
  .node rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
  /* typed cells — fill by Cell_Type */
  .node.t-logic rect{fill:#fff;stroke:#7E8CA0}
  .node.t-custom rect{fill:#F2EAFB;stroke:#8257B8;stroke-width:2}
  .node.t-router rect{fill:#E9F1FE;stroke:#3C6FD0}
  .node.t-bridge rect{fill:#E9F1FE;stroke:#3C6FD0;stroke-dasharray:0}
  .node.t-injector rect{fill:#EAF7EE;stroke:#5BA46F}
  .node.t-extractor rect{fill:#FDF0E6;stroke:#C8793F}
  .node.t-event rect{fill:#F1F3F6;stroke:#9AA6B4}
  .node.t-loadbalanced rect,.node.t-loadcontroller rect{fill:#FFF8E1;stroke:#C9A227}
  /* untyped — the analyzer did not emit Cell_Type for this node */
  .node.untyped rect{stroke-dasharray:4 3}
  .node.untyped.src rect{fill:#EAF7EE;stroke:#5BA46F}
  .node.untyped.sink rect{fill:#FDF0E6;stroke:#C8793F}
  .node.bus rect{fill:var(--signal-soft);stroke:var(--signal);stroke-dasharray:0}
  .node.listener rect{stroke-width:2.5}
  .node{cursor:pointer}
  .edge{fill:none;stroke:var(--line-2);stroke-width:1.4}
  .edge.conn{stroke-dasharray:5 4}
  .dim{opacity:.12}
  .hot .edge, .edge.hot{stroke:var(--signal);stroke-width:2.4}
  .node.hot rect{stroke:var(--signal);stroke-width:2.5}
  .node.near rect{stroke:var(--signal-2,#3D74F0);stroke-width:2}
  .node.faded{opacity:.22}
  .node .halo{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:3 3}
  .scc-ring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5}
  .scc-cap{font-size:11px;fill:var(--ink-3);text-anchor:middle}
  #drop{position:absolute;inset:0;background:rgba(18,87,230,.08);border:3px dashed var(--signal);
        display:none;align-items:center;justify-content:center;font-weight:600;color:var(--signal)}
  #drop.show{display:flex}
  #empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
         justify-content:center;gap:10px;text-align:center;padding:24px;pointer-events:none}
  #empty.show{display:flex}
  #empty .ring{width:76px;height:76px;border-radius:50%;border:2px dashed var(--line-2);
               display:flex;align-items:center;justify-content:center;color:var(--line-2);
               font-size:30px;margin-bottom:4px}
  #empty h3{margin:0;font-size:16px;font-weight:650}
  #empty p{margin:0;color:var(--ink-3);font-size:13px;line-height:1.6;max-width:430px}
  #empty code{font-family:var(--mono);font-size:12px;background:var(--surface-2);
              border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  #empty button{pointer-events:auto;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>NeuPaths <span>· topology viewer</span></h1>
  <div class="tabs">
    <button id="tabDF" class="on">Dataflow</button>
    <button id="tabSY">System</button>
  </div>
  <label class="chk"><input type="checkbox" id="showLabels" checked> edge labels</label>
  <div class="tabs" id="sysMode" hidden
       title="Chosen to suit the topology on load — mesh when cells chain across synapses, buses when they do not. Picking either locks your choice.">
    <button id="modeMesh" class="on">Mesh</button>
    <button id="modeBus">Buses</button>
  </div>
  <div class="spacer"></div>
  <div class="legend" id="legend"></div>
  <button id="pick">Load JSON…</button>
  <button id="reset">Reset view</button>
  <input type="file" id="file" accept=".json" multiple hidden>
</header>
<main>
  <div id="stage">
    <svg id="svg"></svg>
    <div id="empty">
      <div class="ring">◎</div>
      <h3 id="emptyTitle">Nothing loaded yet</h3>
      <p id="emptyBody">Drop a <code>neupaths-topology</code> JSON file anywhere on this panel,
        or use the button below.</p>
      <button id="emptyPick">Load JSON…</button>
    </div>
    <div id="drop">drop a neupaths-topology document</div>
  </div>
  <aside id="side"></aside>
</main>

<script>
"use strict";

/* ---------------------------------------------------------------- data --- */

/* neupaths-topology/1 — one document, one definition of each cell.
   Cells is authoritative: a cell that participates in nothing still exists. */
let TYPES = new Map();
function indexTypes(doc){
  TYPES = new Map();
  for(const c of doc.Cells || []) if(c.Type) TYPES.set(c.Name, c.Type);
}
const typeClass = t => t ? "t-" + String(t).toLowerCase().replace(/[^a-z]/g,"") : "untyped";

/* A cell type that cannot host an activator (bridge, extractor, load
   controller) may arrive as absent, JSON null, the sentinel "None", or the
   string "null" — Java's String.valueOf(null). Treat them all as "no
   activator" so the graph never shows one named after a sentinel. */
const NO_ACTIVATOR = /^(none|null|n\/a|)$/i;
const actOf = e => {
  const a = e.Activator;
  return (a == null || NO_ACTIVATOR.test(String(a).trim())) ? null : a;
};

/* The analyzer names the cell's own pulse transmitter "Pulse"; combined with
   the edge being a loopback that is enough to recognise a PulsedActivator. */
const isPulse = e => e.From === e.To && /^pulse$/i.test(e.Transmitter || "");

function buildGraph(doc){
  const nodes = new Map(), edges = [];
  const blank = n => ({id:n, in:0, out:0, inExt:0, outExt:0});
  for(const c of doc.Cells || []) nodes.set(c.Name, blank(c.Name));
  const touch = n => { if(!nodes.has(n)) nodes.set(n, blank(n)); return nodes.get(n); };
  for(const e of doc.Dataflow || []){
    touch(e.From); touch(e.To);
    const self = e.From === e.To;      // loopback: stays inside one cell
    edges.push({from:e.From, to:e.To, label:e.Transmitter, self,
                receptor:e.Receptor, domain:e.Domain, activator:actOf(e),
                pulse:isPulse(e)});
    nodes.get(e.From).out++; nodes.get(e.To).in++;
    /* Ingress and egress describe the boundary of the *mesh*, so a loopback
       inside a cell must not count — a pulsed sensor still consumes nothing
       from outside itself. */
    if(!self){ nodes.get(e.From).outExt++; nodes.get(e.To).inExt++; }
  }
  /* Two activators in one cell may subscribe to the same wire, so a (from,to)
     pair can carry several edges — fanned apart and labelled by activator. */
  return withSlots({nodes, edges});
}

/* Cell-to-cell interconnection, derived from the synapses: every peer dials
   the listener. When a cell is a listener on one synapse and a peer on
   another — a bridge spanning domains, a router feeding a router — these
   edges chain, and the mesh gets real depth instead of three stars. That is
   also the only way a dial-cycle can form, which is where SCC starts to earn
   its keep. */
function buildMesh(doc){
  const nodes = new Map(), edges = [];
  for(const c of doc.Cells || []) nodes.set(c.Name, {id:c.Name, in:0, out:0});
  const touch = n => { if(!nodes.has(n)) nodes.set(n,{id:n,in:0,out:0}); return nodes.get(n); };
  for(const s of doc.Synapses || []){
    if(!s.Listener) continue;
    touch(s.Listener);
    for(const p of s.Peers || []){
      if(p === s.Listener) continue;          // a cell does not dial itself
      touch(p);
      edges.push({from:p, to:s.Listener, label:s.Domain || s.Name, synapse:s.Name});
      nodes.get(p).out++; nodes.get(s.Listener).in++;
    }
  }
  return withSlots({nodes, edges});
}

/* Index parallel edges so the renderer can fan them apart. */
function withSlots(g){
  const seen = new Map();
  for(const e of g.edges){
    const k = e.from + " " + e.to;
    e.slot = seen.get(k) || 0; seen.set(k, e.slot + 1);
  }
  for(const e of g.edges) e.slots = seen.get(e.from + " " + e.to);
  return g;
}

/* Synapses are first-class in this format — no splitting strings to find the
   domain, and each appears once with its listener and peer list. */
function buildBuses(doc){
  const buses = new Map();
  for(const s of doc.Synapses || []){
    buses.set(s.Name, {label:s.Name, domain:s.Domain, scope:s.Scope,
                       transport:s.Type || s.Transport, address:s.Address,
                       peers:new Set(s.Peers || []),
                       listeners:new Set(s.Listener ? [s.Listener] : [])});
  }
  return buses;
}

/* Tarjan, iterative. */
function sccs(nodes, edges){
  const adj = new Map([...nodes.keys()].map(k=>[k,[]]));
  for(const e of edges) adj.get(e.from).push(e.to);
  const idx=new Map(), low=new Map(), onStk=new Set(), stk=[], out=[];
  let counter=0;
  for(const root of nodes.keys()){
    if(idx.has(root)) continue;
    const work=[[root,0]];
    idx.set(root,counter); low.set(root,counter++); stk.push(root); onStk.add(root);
    while(work.length){
      const frame=work[work.length-1], v=frame[0], nbrs=adj.get(v);
      if(frame[1] < nbrs.length){
        const w = nbrs[frame[1]++];
        if(!idx.has(w)){
          idx.set(w,counter); low.set(w,counter++); stk.push(w); onStk.add(w);
          work.push([w,0]);
        } else if(onStk.has(w)){
          low.set(v, Math.min(low.get(v), idx.get(w)));
        }
      } else {
        work.pop();
        if(work.length){ const p=work[work.length-1][0]; low.set(p, Math.min(low.get(p), low.get(v))); }
        if(low.get(v)===idx.get(v)){
          const comp=[];
          for(;;){ const w=stk.pop(); onStk.delete(w); comp.push(w); if(w===v) break; }
          out.push(comp);
        }
      }
    }
  }
  return out;
}

/* Mesh connectivity.
   SCC is the wrong tool on the peer->listener graph: a listener binds and
   waits while peers dial in, so unless a cell is BOTH (a bridge listening on
   one domain and peering into another) the graph is a DAG and every component
   is a singleton. What matters for a cell system is whether cells can reach
   one another at all — and a synapse is bidirectional once open, so that
   question is undirected.

   Cells and synapses go into one bipartite graph, which lets a synapse itself
   be a cut point: lose it and everything attached only to it is orphaned. */
function meshAnalysis(doc){
  const g = new Map();
  const node = n => { if(!g.has(n)) g.set(n, new Set()); return g.get(n); };
  for(const c of doc.Cells || []) node(c.Name);
  for(const s of doc.Synapses || []){
    const k = "SYN:" + s.Name;
    const members = new Set(s.Peers || []);
    if(s.Listener) members.add(s.Listener);
    for(const m of members){ node(k).add(m); node(m).add(k); }
  }

  // connected components, reported in terms of cells
  const seen = new Set(), comps = [];
  for(const n of g.keys()){
    if(seen.has(n)) continue;
    const stack = [n], cells = [];
    while(stack.length){
      const v = stack.pop();
      if(seen.has(v)) continue;
      seen.add(v);
      if(!v.startsWith("SYN:")) cells.push(v);
      for(const w of g.get(v)) if(!seen.has(w)) stack.push(w);
    }
    if(cells.length) comps.push(cells.sort());
  }
  comps.sort((a,b)=>b.length-a.length);

  // articulation points (Hopcroft–Tarjan), iterative
  const disc = new Map(), low = new Map(), parent = new Map(), arts = new Set();
  let t = 0;
  for(const root of g.keys()){
    if(disc.has(root)) continue;
    disc.set(root, t); low.set(root, t++); parent.set(root, null);
    let rootKids = 0;
    const stack = [[root, g.get(root).values()]];
    while(stack.length){
      const [u, it] = stack[stack.length-1];
      const nx = it.next();
      if(!nx.done){
        const v = nx.value;
        if(v === parent.get(u)) continue;
        if(disc.has(v)){
          low.set(u, Math.min(low.get(u), disc.get(v)));
        } else {
          parent.set(v, u);
          disc.set(v, t); low.set(v, t++);
          if(u === root) rootKids++;
          stack.push([v, g.get(v).values()]);
        }
      } else {
        stack.pop();
        const p = parent.get(u);
        if(p !== null && p !== undefined){
          low.set(p, Math.min(low.get(p), low.get(u)));
          if(p !== root && low.get(u) >= disc.get(p)) arts.add(p);
        }
      }
    }
    if(rootKids > 1) arts.add(root);
  }

  return {
    components: comps,
    cutCells:    [...arts].filter(a=>!a.startsWith("SYN:")).sort(),
    cutSynapses: [...arts].filter(a=> a.startsWith("SYN:")).map(a=>a.slice(4)).sort()
  };
}

/* -------------------------------------------------------------- layout --- */

const NW=146, NH=34;                       // node box
const slot = (i,n,span,pad)=> pad + (n<2 ? span/2 : i*span/(n-1));

/* Dataflow: condense to the SCC DAG, layer the condensation left-to-right,
   and lay each multi-node SCC out as a ring. A cyclic control system has no
   meaningful top or bottom, so a plain layered layout would invent one. */
function layoutDataflow(g){
  const comps = sccs(g.nodes, g.edges);
  const compOf = new Map();
  comps.forEach((c,i)=>c.forEach(n=>compOf.set(n,i)));

  const cAdj = comps.map(()=>new Set());
  for(const e of g.edges){
    const a=compOf.get(e.from), b=compOf.get(e.to);
    if(a!==b) cAdj[a].add(b);
  }
  // longest-path layering over the condensation (it is acyclic by construction)
  const layer = comps.map(()=>0);
  let changed=true, guard=0;
  while(changed && guard++ < comps.length+2){
    changed=false;
    cAdj.forEach((outs,a)=>outs.forEach(b=>{
      if(layer[b] < layer[a]+1){ layer[b]=layer[a]+1; changed=true; }
    }));
  }

  // size each component
  const geom = comps.map(c=>{
    if(c.length===1) return {w:NW, h:NH, ring:0};
    const r = Math.max(170, (c.length*(NW+26))/(2*Math.PI));
    return {w:2*r+NW, h:2*r+NH, ring:r};
  });

  const byLayer = new Map();
  comps.forEach((c,i)=>{ if(!byLayer.has(layer[i])) byLayer.set(layer[i],[]); byLayer.get(layer[i]).push(i); });

  const pos = new Map();
  const GAPX=120, GAPY=70;
  let x=60;
  /* Wrap a tall layer into several sub-columns. A star topology puts every
     peer in layer 0; left as one column it becomes a thin ribbon that fits
     to height and shrinks everything to nothing. */
  const HBUDGET = 620;
  [...byLayer.keys()].sort((a,b)=>a-b).forEach(L=>{
    const ids = byLayer.get(L);
    let colW = Math.max(...ids.map(i=>geom[i].w));
    let y = 60;
    for(const i of ids){
      if(y > 60 && y + geom[i].h > HBUDGET){   // start another sub-column
        x += colW + GAPX;
        colW = Math.max(...ids.map(j=>geom[j].w));
        y = 60;
      }
      const cx = x + colW/2, cy = y + geom[i].h/2;
      const c = comps[i];
      if(c.length===1){
        pos.set(c[0], {x:cx, y:cy});
      } else {
        // barycentre ordering around the ring to shorten chords
        let order = c.slice();
        const nbr = new Map(order.map(n=>[n,[]]));
        for(const e of g.edges){
          if(compOf.get(e.from)===i && compOf.get(e.to)===i){
            nbr.get(e.from).push(e.to); nbr.get(e.to).push(e.from);
          }
        }
        for(let pass=0; pass<24; pass++){
          const ang = new Map(order.map((n,k)=>[n, 2*Math.PI*k/order.length]));
          const key = new Map();
          for(const n of order){
            const ns = nbr.get(n);
            if(!ns.length){ key.set(n, ang.get(n)); continue; }
            let sx=0, sy=0;
            for(const m of ns){ sx+=Math.cos(ang.get(m)); sy+=Math.sin(ang.get(m)); }
            let a = Math.atan2(sy,sx); if(a<0) a+=2*Math.PI;
            key.set(n,a);
          }
          order = order.slice().sort((p,q)=>key.get(p)-key.get(q));
        }
        const r = geom[i].ring;
        order.forEach((n,k)=>{
          const a = 2*Math.PI*k/order.length - Math.PI/2;
          pos.set(n, {x:cx + r*Math.cos(a), y:cy + r*Math.sin(a), ring:i});
        });
      }
      y += geom[i].h + GAPY;
    }
    x += colW + GAPX;
  });

  const rings = comps.map((c,i)=>{
    if(c.length<2) return null;
    const xs=c.map(n=>pos.get(n).x), ys=c.map(n=>pos.get(n).y);
    return {cx:(Math.min(...xs)+Math.max(...xs))/2, cy:(Math.min(...ys)+Math.max(...ys))/2,
            r:geom[i].ring + NH*0.9, n:c.length};
  }).filter(Boolean);

  return {pos, rings, kind:"dataflow"};
}

/* System: peers | synapse bus | listener. The label is a property of the bus,
   so it is drawn once instead of once per arc. */
function layoutSystem(doc){
  const buses = buildBuses(doc);
  const busArr = [...buses.values()].sort((a,b)=>b.peers.size-a.peers.size);
  const peers = new Set(); busArr.forEach(b=>b.peers.forEach(p=>peers.add(p)));
  const listeners = new Set(); busArr.forEach(b=>b.listeners.forEach(l=>listeners.add(l)));

  const H = Math.max(520, peers.size*52);
  const pos = new Map(), busPos = new Map();

  busArr.forEach((b,i)=> busPos.set(b.label, {x:620, y:slot(i,busArr.length,H*0.72,H*0.14)}));

  // peer y = mean y of the buses it attaches to, then de-overlap by rank
  const peerKey = [...peers].map(p=>{
    const ys=[]; busArr.forEach(b=>{ if(b.peers.has(p)) ys.push(busPos.get(b.label).y); });
    return {p, k: ys.reduce((a,c)=>a+c,0)/ys.length, multi: ys.length>1};
  }).sort((a,b)=>a.k-b.k);
  peerKey.forEach((o,i)=> pos.set(o.p, {x:170, y:slot(i,peerKey.length,H*0.94,H*0.03)}));

  [...listeners].forEach(l=>{
    const ys=[]; busArr.forEach(b=>{ if(b.listeners.has(l)) ys.push(busPos.get(b.label).y); });
    pos.set(l, {x:1060, y: ys.reduce((a,c)=>a+c,0)/ys.length});
  });

  return {pos, busPos, buses:busArr, kind:"system"};
}

/* -------------------------------------------------------------- render --- */

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const el = (t,a={})=>{ const n=document.createElementNS(NS,t);
  for(const k in a) n.setAttribute(k,a[k]); return n; };

let view = {x:0,y:0,k:1}, bounds=null;

function applyView(){
  const vp = document.getElementById("vp");
  if(vp) vp.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`);
}

function fit(){
  if(!bounds) return;
  const r = svg.getBoundingClientRect();
  const pad = 40;
  const k = Math.min((r.width-pad*2)/bounds.w, (r.height-pad*2)/bounds.h, 1.3);
  view.k = k;
  view.x = (r.width - bounds.w*k)/2 - bounds.x*k;
  view.y = (r.height - bounds.h*k)/2 - bounds.y*k;
  applyView();
}

/* boundary: "in" where data enters the mesh, "out" where it leaves.
   cut: removing this node would split the mesh — drawn with a warning halo. */
function nodeBox(g, id, x, y, cls, boundary, cut){
  const n = el("g",{class:"node "+(cls||""), "data-id":id});
  if(cut) n.appendChild(el("rect",{class:"halo", x:x-NW/2-5, y:y-NH/2-5,
                                   width:NW+10, height:NH+10, rx:11}));
  n.appendChild(el("rect",{x:x-NW/2, y:y-NH/2, width:NW, height:NH, rx:7}));
  if(boundary){
    const left = boundary === "in";
    n.appendChild(el("circle",{cx: x + (left ? -NW/2 : NW/2), cy: y, r: 4.5,
                               fill: left ? "#5BA46F" : "#C8793F",
                               stroke:"#fff", "stroke-width":1.5}));
  }
  const t = el("text",{class:"nlabel", x:x, y:y+1});
  t.textContent = id;
  n.appendChild(t);
  g.appendChild(n);
}

/* Returns the path plus the point at t=0.5 ON the curve, so an edge label
   sits on its own arc instead of floating over the straight chord. */
function curve(x1,y1,x2,y2,bow){
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L, b=(bow||0.12)*L;
  const cx=mx+nx*b, cy=my+ny*b;
  return {d:`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,
          lx:0.25*x1 + 0.5*cx + 0.25*x2,
          ly:0.25*y1 + 0.5*cy + 0.25*y2};
}

/* shrink an edge so it meets the box edge rather than the centre */
function trim(x1,y1,x2,y2,halfW,halfH){
  const dx=x2-x1, dy=y2-y1;
  const s = Math.max(Math.abs(dx)/(halfW||1), Math.abs(dy)/(halfH||1)) || 1;
  return [x2 - dx/s*0.98, y2 - dy/s*0.98];
}

function render(model, showLabels){
  svg.innerHTML = "";
  const defs = el("defs");
  for(const [id,color] of [["ar","var(--line-2)"],["arHot","var(--signal)"]]){
    const m = el("marker",{id, markerWidth:11, markerHeight:11, refX:9, refY:4,
                           orient:"auto", markerUnits:"userSpaceOnUse"});
    const p = el("path",{d:"M0,0 L9,4 L0,8 z", fill:color});
    m.appendChild(p); defs.appendChild(m);
  }
  svg.appendChild(defs);
  const vp = el("g",{id:"vp"});
  svg.appendChild(vp);
  const gEdge = el("g"), gNode = el("g"), gLab = el("g");
  vp.appendChild(gEdge); vp.appendChild(gNode); vp.appendChild(gLab);

  const pos = model.pos;
  const adjacency = new Map();   // node -> edge indices
  const mark = (n,i)=>{ if(!adjacency.has(n)) adjacency.set(n,[]); adjacency.get(n).push(i); };
  const nbr = new Map();         // node -> neighbouring node ids
  const pair = (a,b)=>{
    if(!nbr.has(a)) nbr.set(a,new Set());
    if(!nbr.has(b)) nbr.set(b,new Set());
    nbr.get(a).add(b); nbr.get(b).add(a);
  };

  if(model.kind === "dataflow"){
    for(const r of model.rings){
      vp.insertBefore(el("circle",{class:"scc-ring", cx:r.cx, cy:r.cy, r:r.r}), gEdge);
      const cap = el("text",{class:"scc-cap", x:r.cx, y:r.cy - r.r - 12});
      cap.textContent = `feedback cycle · ${r.n} cells`;
      vp.insertBefore(cap, gEdge);
    }
    model.edges.forEach((e,i)=>{
      const a=pos.get(e.from), b=pos.get(e.to);
      if(!a||!b) return;
      /* A loopback never leaves its cell, so there is no line to draw between
         two points — it becomes an arc looping out of the top of the node and
         back. Several loopbacks on one cell nest at increasing radius. */
      let c;
      if(e.self){
        const k = 1 + e.slot * 0.42;
        const sx = a.x - 24, sy = a.y - NH/2, ex = a.x + 24;
        const lift = 30 * k;
        c = { d:`M${sx},${sy} C${sx - 20*k},${sy - lift} ${ex + 20*k},${sy - lift} ${ex},${sy}`,
              lx:a.x, ly:sy - lift*0.78 };
      } else {
        const [tx,ty] = trim(a.x,a.y,b.x,b.y,NW/2,NH/2);
        /* Fan parallel edges apart so two activators on the same wire are
           separately visible instead of drawn exactly on top of each other. */
        const bow = e.slots > 1 ? 0.10 + (e.slot - (e.slots-1)/2) * 0.17 : 0.10;
        c = curve(a.x,a.y,tx,ty,bow);
      }
      gEdge.appendChild(el("path",{class:"edge" + (model.conn ? " conn" : ""),
                                   d:c.d, "marker-end":"url(#ar)", "data-i":i}));
      mark(e.from,i); mark(e.to,i); pair(e.from,e.to);
      if(showLabels){
        const t = el("text",{class:"elabel", x:c.lx, y:c.ly - 3, "data-i":i});
        /* Only the activator tells parallel edges apart, so name it there. */
        /* a loopback naming the same transmitter and receptor reads
           better collapsed than as "Pulse -> Pulse" */
        const act = e.activator ? " \u00b7 " + e.activator : "";
        t.textContent = e.self
          ? (e.label === e.receptor ? `${e.label}${act}`
                                    : `${e.label} \u2192 ${e.receptor}${act}`)
          : (e.slots > 1 && e.activator) ? `${e.label} \u2192 ${e.activator}` : e.label;
        gLab.appendChild(t);
      }
    });
    const cutSet = new Set(model.mesh ? model.mesh.cutCells : []);
    const compOf = new Map();
    if(model.mesh && model.mesh.components.length > 1)
      model.mesh.components.forEach((c,i)=>c.forEach(n=>compOf.set(n,i)));
    const TINTS = ["#1257E6","#B4541A","#5BA46F","#8257B8","#C9A227"];
    for(const [id,p] of pos){
      const n = model.nodes.get(id);
      const t = TYPES.get(id);
      const din = n.inExt !== undefined ? n.inExt : n.in;
      const dout = n.outExt !== undefined ? n.outExt : n.out;
      const degree = din===0 ? "src" : (dout===0 ? "sink" : "");
      /* In the mesh view in/out degree means "nobody dials me" / "I dial
         nobody", which is not the data boundary — so no ingress dots there. */
      const boundary = model.conn || (din===0 && dout===0) ? null
                     : (din===0 ? "in" : (dout===0 ? "out" : null));
      nodeBox(gNode, id, p.x, p.y, `${typeClass(t)} ${t ? "" : degree}`.trim(),
              boundary, cutSet.has(id));
      if(compOf.has(id)){
        const r = gNode.lastChild.querySelector("rect:not(.halo)");
        r.style.stroke = TINTS[compOf.get(id) % TINTS.length];
        r.style.strokeWidth = "2.5";
      }
    }
  } else {
    let i=0;
    for(const b of model.buses){
      const bp = model.busPos.get(b.label);
      for(const p of b.peers){
        const a = pos.get(p);
        const [tx,ty]=trim(a.x,a.y,bp.x,bp.y,150,22);
        gEdge.appendChild(el("path",{class:"edge conn", d:curve(a.x,a.y,tx,ty,0.05).d,
                                     "marker-end":"url(#ar)","data-i":i}));
        mark(p,i); mark("BUS:"+b.label,i); pair(p,"BUS:"+b.label); i++;
      }
      for(const l of b.listeners){
        const c = pos.get(l);
        const [tx,ty]=trim(bp.x,bp.y,c.x,c.y,NW/2,NH/2);
        gEdge.appendChild(el("path",{class:"edge conn", d:curve(bp.x,bp.y,tx,ty,0.03).d,
                                     "marker-end":"url(#ar)","data-i":i}));
        mark(l,i); mark("BUS:"+b.label,i); pair(l,"BUS:"+b.label); i++;
      }
    }
    for(const b of model.buses){
      const bp = model.busPos.get(b.label);
      const w = Math.max(300, b.label.length*7.0 + 44);   // 11.5px mono + padding
      const n = el("g",{class:"node bus","data-id":"BUS:"+b.label});
      n.appendChild(el("rect",{x:bp.x-w/2, y:bp.y-22, width:w, height:44, rx:22}));
      const t = el("text",{class:"nlabel", x:bp.x, y:bp.y+1});
      t.textContent = b.label; t.setAttribute("font-family","var(--mono)");
      t.setAttribute("font-size","11.5"); n.appendChild(t);
      gNode.appendChild(n);
    }
    const cut = new Set(model.mesh ? model.mesh.cutCells : []);
    /* Only tint by component when the mesh is actually split — on a healthy
       single-component mesh the colour would carry no information. */
    const comp = new Map();
    if(model.mesh && model.mesh.components.length > 1)
      model.mesh.components.forEach((c,i)=>c.forEach(n=>comp.set(n,i)));
    const TINT = ["#1257E6","#B4541A","#5BA46F","#8257B8","#C9A227"];
    for(const [id,p] of pos){
      const isL = model.buses.some(b=>b.listeners.has(id));
      nodeBox(gNode, id, p.x, p.y,
              `${typeClass(TYPES.get(id))}${isL ? " listener" : ""}`, null, cut.has(id));
      if(comp.has(id)){
        /* Inline style, not a presentation attribute: the per-type CSS rules
           (.node.t-logic rect {stroke:…}) would otherwise win. */
        const r = gNode.lastChild.querySelector("rect:not(.halo)");
        r.style.stroke = TINT[comp.get(id) % TINT.length];
        r.style.strokeWidth = "2.5";
      }
    }
  }

  // bounds
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [,p] of pos){ x0=Math.min(x0,p.x-NW); y0=Math.min(y0,p.y-NH);
                          x1=Math.max(x1,p.x+NW); y1=Math.max(y1,p.y+NH); }
  if(model.busPos) for(const [,p] of model.busPos){ x0=Math.min(x0,p.x-220); x1=Math.max(x1,p.x+220);
                          y0=Math.min(y0,p.y-50); y1=Math.max(y1,p.y+50); }
  if(model.rings) for(const r of model.rings){ x0=Math.min(x0,r.cx-r.r-40); x1=Math.max(x1,r.cx+r.r+40);
                          y0=Math.min(y0,r.cy-r.r-40); y1=Math.max(y1,r.cy+r.r+40); }
  bounds = {x:x0, y:y0, w:x1-x0, h:y1-y0};

  /* Hovering either end of a connection lights the whole relationship: a cell
     lights the synapses it is on, a synapse lights every cell attached to it. */
  const allNodes = [...gNode.querySelectorAll(".node")];
  allNodes.forEach(n=>{
    n.addEventListener("mouseenter", ()=>{
      const id = n.getAttribute("data-id");
      const keep = new Set(adjacency.get(id)||[]);
      const near = nbr.get(id) || new Set();
      gEdge.querySelectorAll("path").forEach(p=>{
        const on = keep.has(+p.getAttribute("data-i"));
        p.classList.toggle("hot", on);
        p.classList.toggle("dim", !on);
        if(on) p.setAttribute("marker-end","url(#arHot)");
      });
      gLab.querySelectorAll("text").forEach(t=>
        t.classList.toggle("dim", !keep.has(+t.getAttribute("data-i"))));
      allNodes.forEach(m=>{
        const mid = m.getAttribute("data-id");
        if(mid === id) m.classList.add("hot");
        else if(near.has(mid)) m.classList.add("near");
        else m.classList.add("faded");
      });
    });
    n.addEventListener("mouseleave", ()=>{
      gEdge.querySelectorAll("path").forEach(p=>{
        p.classList.remove("hot","dim"); p.setAttribute("marker-end","url(#ar)"); });
      gLab.querySelectorAll("text").forEach(t=>t.classList.remove("dim"));
      allNodes.forEach(m=>m.classList.remove("hot","near","faded"));
    });
  });

  fit();
}

/* ------------------------------------------------------------ findings --- */

/* Dismissals persist where they can. Chrome restricts localStorage on some
   file:// origins, so fall back to memory rather than throwing. */
const STORE = "neupaths.viewer.dismissed";
let SHOW_HUSH = false;
function loadDismissed(){
  try { return new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); }
  catch(e){ return new Set(); }
}
function saveDismissed(){
  try { localStorage.setItem(STORE, JSON.stringify([...DISMISSED])); } catch(e){}
}
let DISMISSED = loadDismissed();

function findings(doc){
  const g = buildGraph(doc);
  const buses = buildBuses(doc);
  const registry = new Set((doc.Cells || []).map(c => c.Name));
  const out = [];

  if(!registry.size){
    document.getElementById("side").innerHTML =
      "<h2>Findings</h2><div class='hint'>Load a topology to run the checks.</div>";
    return;
  }

  const withType = n => TYPES.has(n) ? `${n} (${TYPES.get(n)})` : n;

  /* Referential integrity — Cells is authoritative, so anything an edge or a
     synapse names that is not in it is a generator bug, not a design finding. */
  const dangling = new Set();
  for(const e of doc.Dataflow || [])
    for(const k of ["From","To"]) if(!registry.has(e[k])) dangling.add(e[k]);
  for(const s of doc.Synapses || []){
    if(s.Listener && !registry.has(s.Listener)) dangling.add(s.Listener);
    for(const p of s.Peers || []) if(!registry.has(p)) dangling.add(p);
  }
  if(dangling.size) out.push({k:"warn", t:"Names not in the Cells registry",
    b:[...dangling].join(", "),
    why:"Referenced by a dataflow edge or a synapse but never declared. Cells is authoritative, so this is an analyzer bug."});

  /* Boundary of the cell system: data enters at an ingress, leaves at an
     egress where a cell acts on hardware the graph cannot see. Not faults. */
  const ingress = [...g.nodes.values()].filter(n=>n.inExt===0 && n.outExt>0).map(n=>n.id);
  const egress  = [...g.nodes.values()].filter(n=>n.outExt===0 && n.inExt>0).map(n=>n.id);
  const isolated= [...g.nodes.values()].filter(n=>n.inExt===0 && n.outExt===0).map(n=>n.id);
  if(ingress.length) out.push({k:"info", t:"Ingress — data enters here",
    b:ingress.map(withType).join(", "),
    why:"Consumes nothing inside the mesh. Normal for injectors carrying sensor or operator input in from outside."});
  if(egress.length) out.push({k:"info", t:"Egress — data leaves here",
    b:egress.map(withType).join(", "),
    why:"Produces no stimulus anyone consumes. Normal for a cell acting on hardware or external state outside the mesh."});

  /* Declared in Cells and wired to no dataflow at all. Routers and event
     cells belong here by definition; an injector is usually an unused
     template slot; anything else is worth a second look. */
  if(isolated.length){
    const EXPECT = /^(router|event)$/i;
    const expected  = isolated.filter(n=>EXPECT.test(TYPES.get(n)||""));
    const injectors = isolated.filter(n=>/^injector$/i.test(TYPES.get(n)||""));
    const odd       = isolated.filter(n=>!EXPECT.test(TYPES.get(n)||"") &&
                                         !/^injector$/i.test(TYPES.get(n)||""));
    if(expected.length) out.push({k:"info", t:"No dataflow — expected",
      b:expected.map(withType).join(", "),
      why:"Routers hold no subscriptions and event cells carry EventStimulus, so neither appears in the dataflow graph."});
    if(injectors.length) out.push({k:"info", t:"Injector with no subscribers",
      b:injectors.map(withType).join(", "),
      why:"Produces nothing anyone consumes. Usually an unused injector slot from a subsystem template rather than a defect."});
    if(odd.length) out.push({k:"warn", t:"No dataflow — unexplained",
      b:odd.map(withType).join(", "),
      why:"Declared and attached, but exchanges no stimuli at all."});
  }

  /* A cell on no synapse cannot be reached from another process. */
  const onSyn = new Set();
  buses.forEach(b=>{ b.peers.forEach(p=>onSyn.add(p)); b.listeners.forEach(l=>onSyn.add(l)); });
  const stranded = [...registry].filter(n=>!onSyn.has(n));
  if(stranded.length) out.push({k:"warn", t:"On no synapse",
    b:stranded.map(withType).join(", "),
    why:"Declared but attached to no synapse — unreachable unless it shares a JVM with every cell it talks to."});

  const untyped = [...registry].filter(n=>!TYPES.has(n));
  if(untyped.length) out.push({k:"warn", t:"Missing Type",
    b:`${untyped.length} of ${registry.size} cells`,
    why:`${untyped.join(", ")} — drawn with a dashed border.`});

  /* Loopbacks stay inside one cell: a pulse driving a PulsedActivator, or an
     activator feeding a sibling activator in the same cell. Worth separating
     because they are the only edges that cross no synapse. */
  const loops = g.edges.filter(e=>e.self);
  if(loops.length){
    const pulses = loops.filter(e=>e.pulse);
    const internal = loops.filter(e=>!e.pulse);
    if(pulses.length) out.push({k:"info", t:"Pulse-driven activators",
      b:pulses.map(e=>`${e.from}.${e.activator || "?"}`).join(", "),
      why:"Fired by their cell's own pulse rather than by an arriving stimulus — the one way an activator can act on the absence of data. Drawn as a loop over the cell."});
    if(internal.length) out.push({k:"info", t:"Intra-cell loopbacks",
      b:internal.map(e=>`${e.from}.${e.label} → ${e.receptor}`).join(", "),
      why:"An activator's output feeding a receptor in the same cell, so the stimulus never crosses a synapse. Used to stage a pipeline inside one deployable unit."});
  }

  /* Same wire, different activators: invisible at cell granularity. */
  const wires = new Map();
  for(const e of g.edges){
    const k = `${e.from}.${e.label} → ${e.to}.${e.receptor}`;
    if(!wires.has(k)) wires.set(k, []); wires.get(k).push(e.activator || "—");
  }
  const shared = [...wires].filter(([,v])=>v.length>1);
  if(shared.length) out.push({k:"info", t:"One wire, several activators",
    b:`${shared.length} subscription${shared.length>1?"s":""}`,
    why:shared.map(([k,v])=>`${k} feeds ${v.join(" and ")}`).join("; ") +
        ". Drawn as separate fanned arcs; at cell granularity they would collapse into one."});

  const comps = sccs(g.nodes, g.edges).filter(c=>c.length>1);
  if(comps.length){
    const biggest = comps.sort((a,b)=>b.length-a.length)[0];
    out.push({k:"info", t:"Feedback cycle", b:`${biggest.length} of ${g.nodes.size} cells`,
      why:"One strongly-connected component. Normal for a control loop, but it means the graph has no meaningful top or bottom — hence the ring layout."});
  }

  const homes = new Map();
  buses.forEach(b=>b.peers.forEach(p=>{
    if(!homes.has(p)) homes.set(p,new Set()); homes.get(p).add(b.domain || b.label);
  }));
  const multi = [...homes].filter(([,v])=>v.size>1);
  if(multi.length) out.push({k:"info", t:"Multi-homed cells",
    b:`${multi.length} of ${homes.size}`,
    why:multi.map(([k,v])=>`${k} → ${[...v].join(" + ")}`).join("; ") +
        ". These stitch the synapses into one mesh."});

  /* Connectivity of the synapse mesh. */
  const mesh = meshAnalysis(doc);
  if(mesh.components.length > 1){
    out.push({k:"warn", t:"Mesh is split into islands",
      b:`${mesh.components.length} components`,
      why:mesh.components.map((c,i)=>`#${i+1} (${c.length}): ${c.join(", ")}`).join("  ·  ") +
          ". Cells in different components can never exchange a stimulus."});
  } else if(mesh.components.length === 1){
    out.push({k:"info", t:"Mesh is fully connected",
      b:`${mesh.components[0].length} cells, one component`,
      why:"Every cell can reach every other through some chain of synapses."});
  }
  if(mesh.cutCells.length){
    out.push({k:"warn", t:"Cell is a single point of failure",
      b:mesh.cutCells.map(withType).join(", "),
      why:"Removing this cell splits the mesh into disconnected pieces — it is the only path between two groups of cells. Consider a second cell spanning the same synapses."});
  } else if(mesh.components.length === 1){
    out.push({k:"info", t:"No cell is a cut point",
      b:"mesh survives any single cell loss",
      why:"No individual cell, if removed, would partition the mesh. Synapses themselves are still cut points by nature."});
  }
  if(mesh.cutSynapses.length) out.push({k:"info", t:"Synapses are cut points by nature",
    b:`${mesh.cutSynapses.length} of ${buses.size}`,
    why:"Losing a synapse orphans every cell attached only to it: " +
        mesh.cutSynapses.map(s=>s.split("#")[2] || s).join(", ") +
        ". Redundant paths need a second synapse, as the ReflexArc demo does with dual bridges."});

  /* Give the proposed peer->listener SCC a home: silent unless a cell is both
     a listener and a peer, which is the only way a connection cycle forms. */
  const dirNodes = new Map(), dirEdges = [];
  for(const s of doc.Synapses || []){
    if(!s.Listener) continue;
    if(!dirNodes.has(s.Listener)) dirNodes.set(s.Listener, {id:s.Listener});
    for(const p of s.Peers || []){
      if(!dirNodes.has(p)) dirNodes.set(p, {id:p});
      dirEdges.push({from:p, to:s.Listener});
    }
  }
  /* Whether any cell bridges two synapses decides how much the mesh view can
     show, so it is worth stating outright rather than leaving the reader to
     wonder why the two depictions look the same. */
  const lst = new Set(), prs = new Set();
  for(const s of doc.Synapses || []){
    if(s.Listener) lst.add(s.Listener);
    for(const p of s.Peers || []) prs.add(p);
  }
  const both = [...lst].filter(n=>prs.has(n)).sort();
  if((doc.Synapses || []).length){
    if(both.length) out.push({k:"info", t:"Cells that both listen and dial",
      b:both.map(withType).join(", "),
      why:"Each bridges two synapses, so connections chain through it. This is what gives the mesh view depth beyond a single peer→listener hop."});
    else out.push({k:"info", t:"Flat connection topology",
      b:`${buses.size} synapses, no chaining`,
      why:"No cell is both a listener and a peer, so every connection is one hop and the mesh and bus views carry the same information. The bus view is shown by default as the more compact of the two."});
  }

  const dirCycles = sccs(dirNodes, dirEdges).filter(c=>c.length>1);
  if(dirCycles.length) out.push({k:"info", t:"Connection cycle",
    b:dirCycles.map(c=>c.join(" ↔ ")).join("; "),
    why:"These cells dial each other in a loop — each is a listener on one synapse and a peer on another. Unusual but legal; worth confirming it is deliberate."});

  /* Warnings first — a split mesh must not sit below a screenful of notes. */
  out.sort((a,b) => (a.k === "warn" ? 0 : 1) - (b.k === "warn" ? 0 : 1));

  /* Keyed on title+subject so a dismissal survives reloads but returns the
     moment the underlying facts change. */
  out.forEach(f => f.key = f.t + "|" + f.b);

  const live = out.filter(f=>!DISMISSED.has(f.key));
  const hush = out.filter(f=> DISMISSED.has(f.key));

  const side = document.getElementById("side");
  side.innerHTML = "<h2>Findings</h2>" + (live.length ? "" :
    "<div class='hint'>Nothing outstanding.</div>");

  const card = (f, dismissed) => {
    const d = document.createElement("div");
    d.className = "f " + f.k + (dismissed ? " was-dismissed" : "");
    d.innerHTML = `${f.t}: <b></b><span class="why"></span><span class="x" title="${
      dismissed ? "restore" : "dismiss — stays hidden until the facts change"}">${
      dismissed ? "↺" : "×"}</span>`;
    d.querySelector("b").textContent = f.b;
    d.querySelector(".why").textContent = f.why;
    d.querySelector(".x").onclick = () => {
      dismissed ? DISMISSED.delete(f.key) : DISMISSED.add(f.key);
      saveDismissed(); draw();
    };
    return d;
  };
  live.forEach(f => side.appendChild(card(f, false)));

  if(hush.length){
    const tog = document.createElement("div");
    tog.className = "muted";
    tog.textContent = `${hush.length} dismissed · ${SHOW_HUSH ? "hide" : "show"}`;
    tog.onclick = () => { SHOW_HUSH = !SHOW_HUSH; draw(); };
    side.appendChild(tog);
    if(SHOW_HUSH) hush.forEach(f => side.appendChild(card(f, true)));
  }
  const s = document.createElement("div");
  s.className = "hint";
  s.style.marginTop = "16px";
  s.textContent = `${registry.size} cells · ${g.edges.length} dataflow arcs · ` +
                  `${buses.size} synapses` + (doc.Generated ? ` · generated ${doc.Generated}` : "");
  side.appendChild(s);
}

/* ----------------------------------------------------------- behaviour --- */

/* No data is baked in — the viewer opens empty and is fed by drop or picker,
   so it can never show a stale snapshot of an earlier analyzer run. */
let DOC = {}, loadError = null, tab = "df", sysMode = "mesh", sysModeLocked = false;

const SWATCH = {Logic:["#fff","#7E8CA0"], Custom:["#F2EAFB","#8257B8"],
                Router:["#E9F1FE","#3C6FD0"], Bridge:["#E9F1FE","#3C6FD0"],
                Injector:["#EAF7EE","#5BA46F"], Extractor:["#FDF0E6","#C8793F"],
                Event:["#F1F3F6","#9AA6B4"]};

function typeLegend(ids){
  const present = [...new Set(ids.map(n=>TYPES.get(n)).filter(Boolean))].sort();
  const bits = present.map(t=>{
    const [f,s] = SWATCH[t] || ["#fff","#B9C4D2"];
    return `<span><span class="sw" style="background:${f};border-color:${s}"></span>${t}</span>`;
  });
  if(ids.some(n=>!TYPES.has(n)))
    bits.push('<span><span class="sw" style="background:#fff;border-color:#B9C4D2;border-style:dashed"></span>no Type</span>');
  return bits.join("");
}

const hasCells = () => (DOC.Cells || []).length > 0;

/* One document now, so the only empty states are "nothing loaded" and
   "loaded, but this section is absent". */
function emptyState(){
  const box = document.getElementById("empty");
  const section = tab === "df" ? "Dataflow" : "Synapses";
  const present = hasCells() && (DOC[section] || []).length > 0;
  if(present){ box.classList.remove("show"); return false; }

  const t = document.getElementById("emptyTitle");
  const b = document.getElementById("emptyBody");
  if(loadError){
    t.textContent = "Could not read that file";
    b.innerHTML = `<code>${loadError.replace(/[<&]/g, c=>({"<":"&lt;","&":"&amp;"}[c]))}</code>`;
  } else if(!hasCells()){
    t.textContent = "Nothing loaded yet";
    b.innerHTML = "Drop a <code>neupaths-topology</code> JSON file anywhere on this panel, or use the button below.";
  } else {
    t.textContent = `No ${section} section`;
    b.innerHTML = `The document loaded, but its <code>${section}</code> array is empty or absent. The other view may still have data.`;
  }
  box.classList.add("show");
  document.getElementById("svg").innerHTML = "";
  document.getElementById("legend").innerHTML = "";
  return true;
}

function draw(){
  const showLabels = document.getElementById("showLabels").checked;
  indexTypes(DOC);
  if(emptyState()){ findings(DOC); return; }
  if(tab === "df"){
    const g = buildGraph(DOC);
    const L = layoutDataflow(g);
    render(Object.assign(L,{edges:g.edges, nodes:g.nodes}), showLabels);
    document.getElementById("legend").innerHTML =
      typeLegend([...g.nodes.keys()]) +
      '<span><span class="sw" style="background:#5BA46F;border-color:#5BA46F;border-radius:50%"></span>ingress' +
      '<span class="sw" style="background:#C8793F;border-color:#C8793F;border-radius:50%;margin-left:8px"></span>egress</span>' +
      '<span><i style="border-color:var(--ink-3)"></i>stimulus flows this way</span>';
  } else if(sysMode === "mesh"){
    /* Cell-to-cell interconnection. Same SCC-aware layout as the dataflow
       view, because it is the same kind of object: a directed graph of cells
       that may contain cycles. */
    const g = buildMesh(DOC);
    const mesh = meshAnalysis(DOC);
    const L = layoutDataflow(g);
    render(Object.assign(L,{edges:g.edges, nodes:g.nodes, mesh, conn:true}), showLabels);
    document.getElementById("legend").innerHTML =
      typeLegend([...g.nodes.keys()]) +
      (mesh.cutCells.length
        ? '<span><span class="sw" style="background:#fff;border-color:#B4541A;border-style:dashed"></span>cut point</span>' : "") +
      (mesh.components.length > 1 ? `<span>${mesh.components.length} islands</span>` : "") +
      '<span><i class="dash"></i>peer dials listener (both ways once open)</span>';
  } else {
    const L = layoutSystem(DOC);
    L.mesh = meshAnalysis(DOC);
    render(L, showLabels);
    const split = L.mesh.components.length > 1;
    document.getElementById("legend").innerHTML =
      typeLegend([...L.pos.keys()]) +
      (L.mesh.cutCells.length
        ? '<span><span class="sw" style="background:#fff;border-color:#B4541A;border-style:dashed"></span>cut point</span>' : "") +
      (split ? `<span>${L.mesh.components.length} islands</span>` : "") +
      '<span><i class="dash"></i>peer dials listener (both ways once open)</span>';
  }
  findings(DOC);
}

function setTab(t, push){
  tab = (t === "sy") ? "sy" : "df";
  document.getElementById("tabDF").classList.toggle("on", tab==="df");
  document.getElementById("tabSY").classList.toggle("on", tab==="sy");
  document.getElementById("sysMode").hidden = (tab !== "sy");
  if(push) location.hash = (tab==="sy" ? "system" : "dataflow");
  draw();
}
function paintSysMode(){
  document.getElementById("modeMesh").classList.toggle("on", sysMode==="mesh");
  document.getElementById("modeBus").classList.toggle("on", sysMode==="bus");
}
function setSysMode(m, explicit){
  sysMode = (m === "bus") ? "bus" : "mesh";
  if(explicit) sysModeLocked = true;   // respect a deliberate choice from here on
  paintSysMode();
  draw();
}
document.getElementById("modeMesh").onclick = ()=>setSysMode("mesh", true);
document.getElementById("modeBus").onclick  = ()=>setSysMode("bus", true);

/* A cell that is both a listener and a peer is what gives the mesh depth:
   without one, every edge runs peer -> listener in a single hop and the two
   views carry identical information — so the bus view, which spends less ink,
   is the better default. Only applied until the user picks a view. */
function meshIsChained(doc){
  const listeners = new Set(), peers = new Set();
  for(const s of doc.Synapses || []){
    if(s.Listener) listeners.add(s.Listener);
    for(const p of s.Peers || []) peers.add(p);
  }
  for(const l of listeners) if(peers.has(l)) return true;
  return false;
}
function pickSysMode(doc){
  if(sysModeLocked) return;
  sysMode = meshIsChained(doc) ? "mesh" : "bus";
  paintSysMode();
}
document.getElementById("tabDF").onclick = ()=>setTab("df", true);
document.getElementById("tabSY").onclick = ()=>setTab("sy", true);
window.addEventListener("hashchange", ()=>setTab(/system/i.test(location.hash) ? "sy" : "df", false));
document.getElementById("showLabels").onchange = draw;
document.getElementById("reset").onclick = fit;
document.getElementById("pick").onclick = ()=>document.getElementById("file").click();
document.getElementById("emptyPick").onclick = ()=>document.getElementById("file").click();
document.getElementById("file").onchange = e => ingest([...e.target.files]);

/* A malformed document is reported in place, with the parser's line and
   column, rather than silently repaired — the analyzer should be the thing
   that gets fixed. */
function ingest(files){
  if(!files.length) return;
  const f = files[0];
  const r = new FileReader();
  r.onload = () => {
    loadError = null;
    try{
      const obj = JSON.parse(r.result);
      if(Array.isArray(obj) || !obj.Cells)
        throw new Error("expected a neupaths-topology document with a Cells array");
      if(obj.Format && !/^neupaths-topology\/1\b/.test(obj.Format))
        throw new Error(`unsupported Format "${obj.Format}" — this viewer reads neupaths-topology/1`);
      DOC = obj;
      pickSysMode(DOC);
    }catch(err){
      DOC = {}; loadError = `${f.name}: ${err.message}`;
    }
    draw();
  };
  r.readAsText(f);
}

const stage = document.getElementById("stage"), drop = document.getElementById("drop");
stage.addEventListener("dragover", e=>{ e.preventDefault(); drop.classList.add("show"); });
stage.addEventListener("dragleave", e=>{ if(e.target===stage||e.target===drop) drop.classList.remove("show"); });
stage.addEventListener("drop", e=>{ e.preventDefault(); drop.classList.remove("show");
  ingest([...e.dataTransfer.files]); });

let dragging=false, last=null;
svg.addEventListener("mousedown", e=>{ dragging=true; last=[e.clientX,e.clientY]; svg.classList.add("drag"); });
window.addEventListener("mouseup", ()=>{ dragging=false; svg.classList.remove("drag"); });
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  view.x += e.clientX-last[0]; view.y += e.clientY-last[1];
  last=[e.clientX,e.clientY]; applyView();
});
svg.addEventListener("wheel", e=>{
  e.preventDefault();
  const r = svg.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const f = e.deltaY<0 ? 1.12 : 1/1.12;
  view.x = mx - (mx-view.x)*f; view.y = my - (my-view.y)*f; view.k *= f;
  applyView();
}, {passive:false});
window.addEventListener("resize", fit);

setTab(/system/i.test(location.hash) ? "sy" : "df", false);
</script>
